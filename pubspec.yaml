name: activity_network
version: 0.4.2+44
publish_to: 'none'
description: WayCrew - live activity network for group activities, routes, chat and live tracking.
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  maplibre_gl: ^0.27.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  geolocator: ^14.0.3
  geolocator_android: ^5.0.3
  http: ^1.5.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  ota_update: ^7.1.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/waycrew_icon.png
