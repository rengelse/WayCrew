name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Production audit guard
        run: python3 tool/audit_project.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android host
        run: flutter create --platforms=android --org com.waycrew .

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Apply WayCrew Android configuration
        run: python3 tool/prepare_android_ci.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/waycrew-release.jks
          cat > android/key.properties <<EOF2
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=waycrew-release.jks
          EOF2
          python3 tool/prepare_android_ci.py --signing

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare APK asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "WayCrew-v${{ steps.version.outputs.version }}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayCrew-v${{ steps.version.outputs.version }}
          path: WayCrew-v${{ steps.version.outputs.version }}.apk

      - name: Validate release tag matches app version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          test "${GITHUB_REF_NAME}" = "v${{ steps.version.outputs.version }}" || \
            (echo "Tag ${GITHUB_REF_NAME} does not match pubspec v${{ steps.version.outputs.version }}" && exit 1)

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: WayCrew-v${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
